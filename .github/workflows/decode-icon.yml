name: decode-icon
on:
  push:
    branches: [main]
    paths: ["trader-desk/icon.png.b64"]
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode icon.png from base64 text
        run: |
          base64 -d trader-desk/icon.png.b64 > trader-desk/icon.png
          git rm -q trader-desk/icon.png.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trader-desk/icon.png
          git commit -m "Add Trader Desk icon.png (decoded)"
          git push
